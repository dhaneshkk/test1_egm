[package]
name = "egm-web"
version = "0.1.0"
edition = "2024"
description = "egm-team: the team web app over egm-dsh (Topcoat, Postgres views rebuilt from Vesdb)"
license = "Apache-2.0"

[[bin]]
name = "egm-team"
path = "src/main.rs"

[dependencies]
egm-core = { path = "../egm-core", default-features = false }
egm-audit = { path = "../egm-audit" }
# Experimental; pinned exactly, and all of its use stays in this crate.
topcoat = { version = "=0.12.1", features = ["anyhow"] }
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1"
ureq = { version = "3.5.0", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
