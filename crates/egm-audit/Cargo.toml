[package]
name = "egm-audit"
version = "0.1.0"
edition = "2024"
description = "egm-team's audit log: the AuditLog trait, its Vesdb client, and replay of a feature's gate from its events"
license = "Apache-2.0"

[dependencies]
egm-core = { path = "../egm-core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
